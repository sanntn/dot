version: 2
updates:
  # One npm workspace: the root package-lock.json covers shared, server and web.
  # Every npm update, majors included, lands in a single PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-all:
        patterns:
          - "*"
    ignore:
      # Stay on the current Node line; bump it by hand.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns:
          - "*"
